<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Bot by Krish</title>
    <!-- Link to our CSS file for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>AI Chat Bot</h1>
        <p>By Krish</p>
    </header>

    <!-- Main Chat Application Area -->
    <main class="app-container">
        
        <!-- White Chat Box -->
        <div class="chat-container">
            
            <!-- Chat Messages Area -->
            <div id="chat-box" class="chat-box">
                <!-- Welcome Message -->
                <div class="message ai-message">
                    Hello! I’m Krish AI 👋
                </div>
            </div>

            <!-- Example Questions -->
            <div class="example-questions">
                <button class="example-btn">What is Artificial Intelligence?</button>
                <button class="example-btn">Explain photosynthesis</button>
                <button class="example-btn">Write a short poem</button>
                <button class="example-btn">Help me with homework</button>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <button id="clear-btn" class="secondary-btn" title="Clear Chat">Clear</button>
                <input type="text" id="user-input" placeholder="Type your message here...">
                <button id="send-btn" class="primary-btn">Send</button>
            </div>
            
        </div>
    </main>

    <!-- Link to our JavaScript file for functionality -->
    <script src="script.js"></script>
</body>
</html>
